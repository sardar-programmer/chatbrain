<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chat-Brain</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D97757'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>" />
    <!-- Pre-paint style to avoid ANY visual flash (theme & sidebar layout) -->
    <style>
      :root {
        --sidebar-width: 72px;
        color-scheme: light;
      }
      html {
        background-color: #F8F7F5;
        color: #1A1A1E;
      }
      html.dark {
        background-color: #0B0D14;
        color: #F4F4F6;
        color-scheme: dark;
      }
      html[data-sidebar-collapsed="true"] {
        --sidebar-width: 72px;
      }
      html[data-sidebar-collapsed="false"] {
        --sidebar-width: 260px;
      }
      /* Pure CSS sidebar sizing from html attribute for instant first paint on desktop */
      @media (min-width: 768px) {
        #app-sidebar {
          width: var(--sidebar-width);
          min-width: var(--sidebar-width);
          max-width: var(--sidebar-width);
        }
      }
    </style>
    <!-- Pre-paint script: reads theme & sidebar collapsed state BEFORE first paint -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var storedTheme = params.get('theme') || localStorage.getItem('chat_brain_theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var paramCollapsed = params.get('collapsed');
          var storedCollapsed = localStorage.getItem('chat_brain_sidebar_collapsed');
          var isCollapsed = paramCollapsed !== null
            ? paramCollapsed === 'true'
            : (storedCollapsed !== null ? storedCollapsed === 'true' : true);
          document.documentElement.setAttribute('data-sidebar-collapsed', String(isCollapsed));
        } catch (e) {
          // Local storage unavailable or blocked
        }
      })();
    </script>
  </head>
  <body class="h-dvh w-screen overflow-hidden antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
